<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TTS Player</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@300;400;500&family=IBM+Plex+Sans:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0e0e; --surface: #161616; --border: #2a2a2a;
    --accent: #c8f060; --accent-dim: #8aaa30;
    --text: #d4d4d4; --text-dim: #666;
    --playing-bg: rgba(200, 240, 96, 0.18);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif; font-weight: 300;
    min-height: 100vh; display: flex; flex-direction: column;
  }
  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 999;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");
    opacity: 0.5;
  }
  header {
    border-bottom: 1px solid var(--border); padding: 18px 32px;
    display: flex; align-items: baseline; gap: 16px;
  }
  header h1 { font-family: 'Bebas Neue'; font-size: 26px; letter-spacing: 3px; color: var(--accent); }
  header span { font-family: 'IBM Plex Mono'; font-size: 11px; color: var(--text-dim); letter-spacing: 2px; }
  .layout { display: grid; grid-template-columns: 1fr 300px; flex: 1; overflow: hidden; height: calc(100vh - 63px); }
  html, body { height: 100%; overflow: hidden; }

  /* TEXT PANEL */
  .text-panel { padding: 36px 44px; overflow-y: auto; border-right: 1px solid var(--border); height: 100%; }
  .text-panel::-webkit-scrollbar { width: 3px; }
  .text-panel::-webkit-scrollbar-thumb { background: var(--border); }
  #text-display { font-size: 17px; line-height: 1.95; font-weight: 300; }
  .sentence {
    display: inline; border-radius: 2px; padding: 1px 3px; margin: 0 1px;
    transition: all 0.2s; cursor: pointer; border-left: 2px solid transparent;
  }
  .sentence.done { color: var(--text-dim); }
  .sentence.active {
    background: var(--playing-bg); border-left: 2px solid var(--accent);
    color: #fff; padding-left: 8px;
  }
  .sentence:hover { background: rgba(200,240,96,0.07); }
  .no-file {
    font-family: 'IBM Plex Mono'; font-size: 13px; color: var(--text-dim);
    letter-spacing: 1px; margin-top: 20px;
  }

  /* CONTROLS PANEL */
  .controls-panel { padding: 28px 24px; display: flex; flex-direction: column; gap: 22px; overflow-y: auto; height: 100%; }
  .section-label {
    font-family: 'IBM Plex Mono'; font-size: 10px; letter-spacing: 3px;
    text-transform: uppercase; color: var(--text-dim); margin-bottom: 10px;
  }

  /* Waveform */
  .waveform { display: flex; align-items: center; justify-content: center; gap: 3px; height: 28px; opacity: 0.25; transition: opacity 0.3s; }
  .waveform.playing { opacity: 1; }
  .bar { width: 3px; background: var(--accent); border-radius: 2px; height: 4px; }
  .waveform.playing .bar { animation: wave 0.8s ease-in-out infinite; }
  .waveform.playing .bar:nth-child(1)  { animation-delay: 0.00s; }
  .waveform.playing .bar:nth-child(2)  { animation-delay: 0.10s; }
  .waveform.playing .bar:nth-child(3)  { animation-delay: 0.15s; }
  .waveform.playing .bar:nth-child(4)  { animation-delay: 0.05s; }
  .waveform.playing .bar:nth-child(5)  { animation-delay: 0.20s; }
  .waveform.playing .bar:nth-child(6)  { animation-delay: 0.12s; }
  .waveform.playing .bar:nth-child(7)  { animation-delay: 0.08s; }
  .waveform.playing .bar:nth-child(8)  { animation-delay: 0.18s; }
  .waveform.playing .bar:nth-child(9)  { animation-delay: 0.03s; }
  .waveform.playing .bar:nth-child(10) { animation-delay: 0.14s; }
  @keyframes wave { 0%,100%{height:4px} 50%{height:22px} }

  /* Progress */
  .progress-track { height: 2px; background: var(--border); border-radius: 1px; overflow: hidden; cursor: pointer; }
  .progress-fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.1s; pointer-events: none; }
  .time-row { display: flex; justify-content: space-between; font-family: 'IBM Plex Mono'; font-size: 11px; color: var(--text-dim); margin-top: 4px; }
  audio { width: 100%; margin-top: 10px; accent-color: var(--accent); }
  #sent-info { font-family: 'IBM Plex Mono'; font-size: 10px; color: var(--text-dim); text-align: center; letter-spacing: 1px; margin-top: 6px; }

  /* Nav buttons */
  .nav-row { display: flex; gap: 8px; }
  .ctrl-btn {
    flex: 1; padding: 9px; background: var(--surface); border: 1px solid var(--border);
    color: var(--text); font-family: 'IBM Plex Mono'; font-size: 11px; letter-spacing: 1px;
    cursor: pointer; border-radius: 2px; transition: border-color 0.2s, color 0.2s; text-transform: uppercase;
  }
  .ctrl-btn:hover { border-color: var(--accent-dim); color: var(--accent); }
  .ctrl-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  /* Drop zone — single folder picker */
  .drop-zone {
    border: 1px dashed var(--border); border-radius: 2px; padding: 20px 14px;
    text-align: center; cursor: pointer; transition: all 0.2s;
    font-family: 'IBM Plex Mono'; font-size: 11px; color: var(--text-dim); letter-spacing: 0.5px;
    line-height: 1.8;
  }
  .drop-zone:hover, .drop-zone.dragover { border-color: var(--accent-dim); background: rgba(200,240,96,0.04); color: var(--text); }
  .drop-zone.loaded { border-color: var(--accent-dim); }
  .drop-zone input { display: none; }
  .drop-zone .folder-icon { font-size: 22px; display: block; margin-bottom: 6px; opacity: 0.5; }

  /* File checklist */
  .file-list { display: flex; flex-direction: column; gap: 5px; margin-top: 10px; }
  .file-item {
    display: flex; align-items: center; gap: 8px;
    font-family: 'IBM Plex Mono'; font-size: 10px; color: var(--text-dim); letter-spacing: 0.5px;
  }
  .file-item .dot {
    width: 6px; height: 6px; border-radius: 50%; border: 1px solid var(--border); flex-shrink: 0;
    transition: all 0.3s;
  }
  .file-item.ok .dot { background: var(--accent); border-color: var(--accent); }
  .file-item .fname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 200px; }
  .file-item.ok .fname { color: var(--accent); }

  #status { font-family: 'IBM Plex Mono'; font-size: 11px; color: var(--text-dim); letter-spacing: 1px; text-align: center; min-height: 14px; }
  #status.ok { color: var(--accent); }
  #status.err { color: #ff6b6b; }
</style>
</head>
<body>

<header>
  <h1>TTS PLAYER</h1>
  <span>Silero v5 · Russian</span>
</header>

<div class="layout">

  <div class="text-panel">
    <div id="text-display">
      <p class="no-file">Select output folder to begin →</p>
    </div>
  </div>

  <div class="controls-panel">

    <div class="waveform" id="waveform">
      <div class="bar"></div><div class="bar"></div><div class="bar"></div>
      <div class="bar"></div><div class="bar"></div><div class="bar"></div>
      <div class="bar"></div><div class="bar"></div><div class="bar"></div>
      <div class="bar"></div>
    </div>

    <!-- Playback -->
    <div>
      <div class="section-label">Playback</div>
      <div class="progress-track" id="progress-track">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <div class="time-row">
        <span id="time-cur">0:00</span>
        <span id="time-tot">0:00</span>
      </div>
      <audio id="audio" controls></audio>
      <div id="sent-info">—</div>
    </div>

    <!-- Navigate -->
    <div>
      <div class="section-label">Navigate</div>
      <div class="nav-row">
        <button class="ctrl-btn" id="prev-btn" disabled>◂ Prev</button>
        <button class="ctrl-btn" id="next-btn" disabled>Next ▸</button>
      </div>
    </div>

    <!-- Load folder -->
    <div>
      <div class="section-label">Load Folder</div>

      <!-- Folder picker (webkitdirectory) -->
      <div class="drop-zone" id="dz-folder">
        <input type="file" id="fi-folder" webkitdirectory multiple>
        <span class="folder-icon">📂</span>
        Click to open folder<br>
        <span style="color:var(--text-dim);font-size:10px">or drag &amp; drop folder here</span>
      </div>

      <!-- Also allow selecting multiple files at once as fallback -->
      <div class="drop-zone" id="dz-multi" style="margin-top:8px;">
        <input type="file" id="fi-multi" multiple accept=".wav,.mp3,.ogg,.json,.txt">
        <span style="font-size:9px;letter-spacing:2px;color:var(--text-dim)">OR SELECT FILES</span><br>
        <span style="font-size:10px">Ctrl+click wav + json + txt</span>
      </div>

      <!-- File status checklist -->
      <div class="file-list">
        <div class="file-item" id="fi-status-wav">
          <div class="dot"></div><span class="fname">output.wav</span>
        </div>
        <div class="file-item" id="fi-status-json">
          <div class="dot"></div><span class="fname">timings.json</span>
        </div>
        <div class="file-item" id="fi-status-txt">
          <div class="dot"></div><span class="fname">output_text.txt</span>
        </div>
      </div>
    </div>

    <div id="status">—</div>

  </div>
</div>

<script>
// ── State ─────────────────────────────────────────────
let timings = [];
let sourceText = '';
let currentIdx = -1;
let wavLoaded = false;
let jsonLoaded = false;
let txtLoaded = false;

// ── Elements ──────────────────────────────────────────
const audio        = document.getElementById('audio');
const waveform     = document.getElementById('waveform');
const progressFill = document.getElementById('progress-fill');
const progressTrack= document.getElementById('progress-track');
const timeCur      = document.getElementById('time-cur');
const timeTot      = document.getElementById('time-tot');
const sentInfo     = document.getElementById('sent-info');
const textDisplay  = document.getElementById('text-display');
const prevBtn      = document.getElementById('prev-btn');
const nextBtn      = document.getElementById('next-btn');
const statusEl     = document.getElementById('status');

// ── File detection by name/extension ─────────────────
function classifyFile(file) {
  const name = file.name.toLowerCase();
  if (/\.(wav|mp3|ogg)$/.test(name)) return 'wav';
  if (/\.json$/.test(name))          return 'json';
  if (/\.txt$/.test(name))           return 'txt';
  return null;
}

function processFiles(fileList) {
  const files = Array.from(fileList);
  let found = { wav: null, json: null, txt: null };
  for (const f of files) {
    const type = classifyFile(f);
    if (type && !found[type]) found[type] = f;
  }
  if (found.wav)  loadWav(found.wav);
  if (found.json) loadJson(found.json);
  if (found.txt)  loadTxt(found.txt);
  if (!found.wav && !found.json && !found.txt) {
    setStatus('No recognized files found', 'err');
  }
}

// ── Loaders ───────────────────────────────────────────
function loadWav(file) {
  audio.src = URL.createObjectURL(file);
  wavLoaded = true;
  setFileStatus('wav', file.name);
  checkReady();
}

function loadJson(file) {
  const reader = new FileReader();
  reader.onload = e => {
    try {
      timings = JSON.parse(e.target.result);
      jsonLoaded = true;
      prevBtn.disabled = false;
      nextBtn.disabled = false;
      setFileStatus('json', `${file.name} · ${timings.length} sent`);
      if (txtLoaded) renderSentences();
      checkReady();
    } catch {
      setStatus('Invalid JSON file', 'err');
    }
  };
  reader.readAsText(file);
}

function loadTxt(file) {
  const reader = new FileReader();
  reader.onload = e => {
    sourceText = e.target.result.trim();
    txtLoaded = true;
    setFileStatus('txt', file.name);
    if (jsonLoaded) renderSentences();
    checkReady();
  };
  reader.readAsText(file);
}

// ── Drop zone: folder ─────────────────────────────────
const dzFolder = document.getElementById('dz-folder');
const fiFolder = document.getElementById('fi-folder');
dzFolder.addEventListener('click', () => fiFolder.click());
dzFolder.addEventListener('dragover', e => { e.preventDefault(); dzFolder.classList.add('dragover'); });
dzFolder.addEventListener('dragleave', () => dzFolder.classList.remove('dragover'));
dzFolder.addEventListener('drop', e => {
  e.preventDefault();
  dzFolder.classList.remove('dragover');
  // Collect files from dataTransfer (handles dropped folders in modern browsers)
  const items = e.dataTransfer.items;
  if (items) {
    const files = [];
    const promises = [];
    for (const item of items) {
      const entry = item.webkitGetAsEntry ? item.webkitGetAsEntry() : null;
      if (entry && entry.isDirectory) {
        promises.push(readDirEntries(entry, files));
      } else {
        const f = item.getAsFile();
        if (f) files.push(f);
      }
    }
    Promise.all(promises).then(() => processFiles(files));
  } else {
    processFiles(e.dataTransfer.files);
  }
});
fiFolder.addEventListener('change', () => processFiles(fiFolder.files));

// Recursively read directory entries
function readDirEntries(dirEntry, acc) {
  return new Promise(resolve => {
    const reader = dirEntry.createReader();
    reader.readEntries(entries => {
      const subs = [];
      for (const entry of entries) {
        if (entry.isFile) {
          subs.push(new Promise(res => entry.file(f => { acc.push(f); res(); })));
        } else if (entry.isDirectory) {
          subs.push(readDirEntries(entry, acc));
        }
      }
      Promise.all(subs).then(resolve);
    });
  });
}

// ── Drop zone: multi-file fallback ─────────────────────
const dzMulti = document.getElementById('dz-multi');
const fiMulti = document.getElementById('fi-multi');
dzMulti.addEventListener('click', () => fiMulti.click());
dzMulti.addEventListener('dragover', e => { e.preventDefault(); dzMulti.classList.add('dragover'); });
dzMulti.addEventListener('dragleave', () => dzMulti.classList.remove('dragover'));
dzMulti.addEventListener('drop', e => { e.preventDefault(); dzMulti.classList.remove('dragover'); processFiles(e.dataTransfer.files); });
fiMulti.addEventListener('change', () => processFiles(fiMulti.files));

// ── File status indicators ────────────────────────────
function setFileStatus(type, label) {
  const el = document.getElementById(`fi-status-${type}`);
  if (!el) return;
  el.classList.add('ok');
  el.querySelector('.fname').textContent = label;
}

// ── Render sentences ──────────────────────────────────
function renderSentences() {
  if (!sourceText || !timings.length) return;
  let html = sourceText;
  timings.forEach((t, i) => {
    const escaped = t.sentence.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    html = html.replace(
      new RegExp(escaped),
      `<span class="sentence pending" data-idx="${i}">${t.sentence}</span>`
    );
  });
  html = html.split('\n').map(line => line.trim() ? `<p style="margin-bottom:1.2em">${line}</p>` : '').join('');
  textDisplay.innerHTML = html;
}

// ── Highlight active sentence ─────────────────────────
function highlight(idx) {
  if (idx === currentIdx) return;
  currentIdx = idx;
  textDisplay.querySelectorAll('.sentence').forEach(s => {
    const i = parseInt(s.dataset.idx);
    s.className = 'sentence ' + (i < idx ? 'done' : i === idx ? 'active' : 'pending');
  });
  const active = textDisplay.querySelector('.sentence.active');
  if (active) active.scrollIntoView({ behavior: 'smooth', block: 'center' });
  sentInfo.textContent = `sentence ${idx + 1} / ${timings.length}`;
}

function timeToIdx(t) {
  let idx = 0;
  for (let i = 0; i < timings.length; i++) {
    if (t >= timings[i].start_sec) idx = i;
    else break;
  }
  return idx;
}

// ── Audio events ──────────────────────────────────────
audio.addEventListener('timeupdate', () => {
  const t = audio.currentTime;
  const d = audio.duration || 1;
  progressFill.style.width = (t / d * 100) + '%';
  timeCur.textContent = fmt(t);
  if (timings.length) highlight(timeToIdx(t));
});

audio.addEventListener('loadedmetadata', () => {
  timeTot.textContent = fmt(audio.duration);
});

audio.addEventListener('play',  () => waveform.classList.add('playing'));
audio.addEventListener('pause', () => waveform.classList.remove('playing'));
audio.addEventListener('ended', () => {
  waveform.classList.remove('playing');
  textDisplay.querySelectorAll('.sentence').forEach(s => s.className = 'sentence done');
  sentInfo.textContent = 'Done';
});

progressTrack.addEventListener('click', e => {
  if (!audio.duration) return;
  const rect = progressTrack.getBoundingClientRect();
  audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration;
});

// ── Prev / Next ───────────────────────────────────────
prevBtn.addEventListener('click', () => {
  const idx = Math.max(0, currentIdx - 1);
  if (timings[idx] !== undefined) { audio.currentTime = timings[idx].start_sec; audio.play(); }
});
nextBtn.addEventListener('click', () => {
  const idx = Math.min(timings.length - 1, currentIdx + 1);
  if (timings[idx] !== undefined) { audio.currentTime = timings[idx].start_sec; audio.play(); }
});

textDisplay.addEventListener('click', e => {
  const span = e.target.closest('.sentence');
  if (!span || !audio.src) return;
  const idx = parseInt(span.dataset.idx);
  if (timings[idx] !== undefined) { audio.currentTime = timings[idx].start_sec; audio.play(); }
});

// ── Helpers ───────────────────────────────────────────
function fmt(s) {
  s = Math.floor(s || 0);
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}
function setStatus(msg, cls) {
  statusEl.textContent = msg;
  statusEl.className = cls || '';
}
function checkReady() {
  if (wavLoaded && jsonLoaded && txtLoaded) setStatus('Ready — press play!', 'ok');
  else if (!wavLoaded)  setStatus('Waiting for audio file…', '');
  else if (!jsonLoaded) setStatus('Waiting for timings.json…', '');
  else if (!txtLoaded)  setStatus('Waiting for text file…', '');
}
</script>
</body>
</html>
